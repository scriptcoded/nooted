<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nooted SDK test page</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5 }
      label { display: block; margin-top: 1rem; font-weight: 600 }
      input, textarea { width: 100%; box-sizing: border-box; padding: .5rem; font: inherit }
      button { margin: 1rem .5rem 0 0; padding: .5rem 1rem; font: inherit }
      pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-all }
    </style>
  </head>
  <body>
    <h1>Nooted SDK test page</h1>
    <p>
      A stand-in for a site using the SDK. Serve it on a different origin from Nooted
      (e.g. <code>python3 -m http.server 5174 -d dev/sdk-test</code>) and add that origin to the project.
    </p>

    <label>Nooted URL <input id="nooted" value="http://localhost:5173" /></label>
    <label>Project key <input id="key" placeholder="pk_…" /></label>
    <label>Note <textarea id="note" rows="3">The checkout button does nothing</textarea></label>

    <button id="sign-in">Sign in to Nooted</button>
    <button id="send" disabled>Send test report</button>
    <button id="revoke" disabled>Revoke token</button>

    <pre id="log"></pre>

    <script type="module">
      const $ = (id) => document.getElementById(id)
      const log = (msg) => { $('log').textContent = `${new Date().toLocaleTimeString()} ${msg}\n` + $('log').textContent }
      const base = () => $('nooted').value.replace(/\/$/, '')
      let token = sessionStorage.getItem('nooted:token')
      const setToken = (t) => {
        token = t
        t ? sessionStorage.setItem('nooted:token', t) : sessionStorage.removeItem('nooted:token')
        $('send').disabled = $('revoke').disabled = !t
      }
      setToken(token)
      $('key').value = localStorage.getItem('nooted:key') ?? ''

      window.addEventListener('message', (event) => {
        if (event.origin !== new URL(base()).origin) return
        if (event.data?.type === 'nooted:token') {
          setToken(event.data.token)
          log(`token received for ${event.data.user.email}, expires ${new Date(event.data.expiresAt).toLocaleString()}`)
        } else if (event.data?.type === 'nooted:sign-in-error') {
          log(`sign-in error: ${event.data.reason}`)
        }
      })

      $('sign-in').onclick = () => {
        localStorage.setItem('nooted:key', $('key').value)
        const url = `${base()}/sdk/sign-in?key=${encodeURIComponent($('key').value)}&origin=${encodeURIComponent(location.origin)}`
        window.open(url, 'nooted-sign-in', 'popup,width=420,height=640')
      }

      $('send').onclick = async () => {
        const now = Date.now()
        const payload = {
          clientReportId: crypto.randomUUID(),
          note: $('note').value,
          url: location.href,
          capturedAt: now,
          release: 'sdk-test-page',
          device: {
            userAgent: navigator.userAgent,
            viewport: { width: innerWidth, height: innerHeight, devicePixelRatio: devicePixelRatio },
          },
          // Minimal rrweb-shaped events: a Meta event and a Custom event.
          events: [
            { type: 4, timestamp: now - 1000, data: { href: location.href, width: innerWidth, height: innerHeight } },
            { type: 5, timestamp: now, data: { tag: 'sdk-test', payload: {} } },
          ],
        }
        const body = await new Response(
          new Blob([JSON.stringify(payload)]).stream().pipeThrough(new CompressionStream('gzip')),
        ).arrayBuffer()
        const res = await fetch(`${base()}/api/sdk/reports`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', 'Content-Encoding': 'gzip' },
          body,
        })
        log(`upload → ${res.status} ${await res.text()}`)
      }

      $('revoke').onclick = async () => {
        const res = await fetch(`${base()}/api/sdk/token`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } })
        log(`revoke → ${res.status} (token kept locally so you can confirm the next upload gets 401)`)
      }
    </script>
  </body>
</html>
